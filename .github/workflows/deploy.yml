name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  # Works out what changed since the last successful deploy, so each job below only
  # deploys what it has to. Comparing against the last successful deploy (not the
  # previous commit) means a cancelled or failed run never loses changes.
  changes:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      actions: read
    outputs:
      worker: ${{ steps.diff.outputs.worker }}
      functions: ${{ steps.diff.outputs.functions }}
      hosting: ${{ steps.diff.outputs.hosting }}
      firestore: ${{ steps.diff.outputs.firestore }}
      storage: ${{ steps.diff.outputs.storage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          everything() { for t in worker functions hosting firestore storage; do echo "$t=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          # A manual run redeploys everything (e.g. after changing repository variables).
          [ "${{ github.event_name }}" = workflow_dispatch ] && { echo "Manual run: deploying everything"; everything; }
          BASE=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success \
            --limit 1 --json headSha -q '.[0].headSha' || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable last successful deploy: deploying everything"; everything
          fi
          FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed since last successful deploy ($BASE):"; echo "$FILES"
          hit() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }
          # Shared inputs: any change here redeploys everything.
          ALL='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|packages/core/|\.github/workflows/deploy\.yml)'
          [ "$(hit "$ALL")" = true ] && { echo "Shared input changed: deploying everything"; everything; }
          FB='^firebase\.json$'
          {
            echo "worker=$(hit '^(apps/worker/|packages/(agent|policy)/|apps/web/\.env\.production$)')"
            echo "functions=$(hit "^(apps/functions/|packages/budget/)|$FB")"
            echo "hosting=$(hit "^apps/web/|$FB")"
            echo "firestore=$(hit "^firestore\.(rules|indexes\.json)$|$FB")"
            echo "storage=$(hit "^(storage\.rules|infra/storage-cors\.json)$|$FB")"
          } | tee -a "$GITHUB_OUTPUT"

  firebase:
    needs: changes
    if: >
      needs.changes.outputs.functions == 'true' || needs.changes.outputs.hosting == 'true' ||
      needs.changes.outputs.firestore == 'true' || needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-latest
    # Keyless auth through Workload Identity Federation (see infra/bootstrap.sh).
    permissions:
      contents: read
      id-token: write
    env:
      FUNCTIONS: ${{ needs.changes.outputs.functions }}
      HOSTING: ${{ needs.changes.outputs.hosting }}
      FIRESTORE: ${{ needs.changes.outputs.firestore }}
      STORAGE: ${{ needs.changes.outputs.storage }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build what is being deployed
        run: |
          FILTERS=""
          [ "$FUNCTIONS" = true ] && FILTERS="$FILTERS --filter @dodo/functions..."
          [ "$HOSTING" = true ] && FILTERS="$FILTERS --filter @dodo/web..."
          if [ -n "$FILTERS" ]; then pnpm $FILTERS --workspace-concurrency=1 build; fi
      - name: Install function runtime dependencies
        if: env.FUNCTIONS == 'true'
        # firebase deploy resolves firebase-functions from the functions source dir.
        run: cd apps/functions/lib && rm -rf node_modules && npm install --omit=dev --no-package-lock --no-audit --no-fund
      - name: Write function parameters
        if: env.FUNCTIONS == 'true'
        # Non-interactive deploys need a value for every param, defaults included.
        run: |
          cat > apps/functions/lib/.env <<EOF
          OWNER_EMAIL=${{ vars.OWNER_EMAIL }}
          BUDGET_HALT_AT=${{ vars.BUDGET_HALT_AT || '40' }}
          BUDGET_DETACH_AT=${{ vars.BUDGET_DETACH_AT || '45' }}
          BUDGET_CURRENCY=${{ vars.BUDGET_CURRENCY || 'EUR' }}
          MODEL_BACKEND=${{ vars.MODEL_BACKEND || 'vertex' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_URL=https://${{ vars.GCP_PROJECT_ID }}.web.app
          EOF
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Deploy to Firebase
        run: |
          ONLY=""
          [ "$HOSTING" = true ] && ONLY="$ONLY,hosting"
          [ "$FIRESTORE" = true ] && ONLY="$ONLY,firestore:rules,firestore:indexes"
          [ "$STORAGE" = true ] && ONLY="$ONLY,storage"
          [ "$FUNCTIONS" = true ] && ONLY="$ONLY,functions"
          echo "Deploying: ${ONLY#,}"
          pnpm exec firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --non-interactive --force --only "${ONLY#,}"
      - name: Let the web app read archived run traces (Storage CORS)
        if: env.STORAGE == 'true'
        run: |
          set -a; . apps/web/.env.production; set +a
          gcloud storage buckets update "gs://$VITE_FIREBASE_STORAGE_BUCKET" --cors-file=infra/storage-cors.json
      - name: Register the Telegram webhook
        if: env.FUNCTIONS == 'true' && env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SECRET=$(printf 'dodo-webhook:%s' "$TOKEN" | sha256sum | cut -c1-64)
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/setWebhook" \
            -d "url=https://europe-west1-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/telegramWebhook" \
            -d "secret_token=$SECRET" -d "allowed_updates=[\"message\",\"callback_query\"]" | sed 's/.*"description":"\([^"]*\)".*/\1/'

  # Runs in parallel with the firebase job.
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dodo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dodo/worker... --workspace-concurrency=1 build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the image registry
        # The registry itself is managed by infra/terraform.
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      - name: Build and push the worker image
        # Layers (the apt-get install in particular) are cached in the GitHub Actions cache.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/worker:${{ github.sha }}
            ${{ env.REGISTRY }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Point the worker Cloud Run Job at the new image
        # The job's settings and its API key are managed by infra/terraform, which ignores the image.
        run: gcloud run jobs update dodo-worker --image "$REGISTRY/worker:${GITHUB_SHA}" --region europe-west1 --quiet

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Keyless auth through Workload Identity Federation (see infra/bootstrap.sh).
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install function runtime dependencies
        # firebase deploy resolves firebase-functions from the functions source dir.
        run: cd apps/functions/lib && rm -rf node_modules && npm install --omit=dev --no-package-lock --no-audit --no-fund
      - name: Write function parameters
        # Non-interactive deploys need a value for every param, defaults included.
        run: |
          cat > apps/functions/lib/.env <<EOF
          OWNER_EMAIL=${{ vars.OWNER_EMAIL }}
          BUDGET_HALT_AT=${{ vars.BUDGET_HALT_AT || '40' }}
          BUDGET_DETACH_AT=${{ vars.BUDGET_DETACH_AT || '45' }}
          BUDGET_CURRENCY=${{ vars.BUDGET_CURRENCY || 'EUR' }}
          MODEL_BACKEND=${{ vars.MODEL_BACKEND || 'vertex' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_URL=https://${{ vars.GCP_PROJECT_ID }}.web.app
          EOF
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Deploy to Firebase
        run: >
          pnpm exec firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --non-interactive --force
          --only hosting,firestore:rules,firestore:indexes,storage,functions
      - name: Let the web app read archived run traces (Storage CORS)
        run: |
          set -a; . apps/web/.env.production; set +a
          gcloud storage buckets update "gs://$VITE_FIREBASE_STORAGE_BUCKET" --cors-file=infra/storage-cors.json
      - name: Register the Telegram webhook
        if: env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          SECRET=$(printf 'dodo-webhook:%s' "$TOKEN" | sha256sum | cut -c1-64)
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/setWebhook" \
            -d "url=https://europe-west1-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/telegramWebhook" \
            -d "secret_token=$SECRET" -d "allowed_updates=[\"message\",\"callback_query\"]" | sed 's/.*"description":"\([^"]*\)".*/\1/'
      - name: Build and push the worker image
        env:
          REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dodo
        run: |
          gcloud artifacts repositories describe dodo --location=europe-west1 >/dev/null 2>&1 ||
            gcloud artifacts repositories create dodo --repository-format=docker --location=europe-west1
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -f apps/worker/Dockerfile -t "$REGISTRY/worker:${GITHUB_SHA}" -t "$REGISTRY/worker:latest" .
          docker push --all-tags "$REGISTRY/worker"
      - name: Worker API key
        # The browser key is restricted to the web app's domains, which blocks sign-in from
        # Cloud Run. The worker gets its own key, restricted by API instead of by website.
        id: worker_key
        run: |
          NAME=$(gcloud services api-keys list --filter='displayName=dodo-worker' --format='value(name)' | head -1)
          if [ -z "$NAME" ]; then
            gcloud services api-keys create --display-name=dodo-worker \
              --api-target=service=identitytoolkit.googleapis.com \
              --api-target=service=securetoken.googleapis.com \
              --api-target=service=firestore.googleapis.com \
              --api-target=service=firebasestorage.googleapis.com --quiet
            NAME=$(gcloud services api-keys list --filter='displayName=dodo-worker' --format='value(name)' | head -1)
          fi
          KEY=$(gcloud services api-keys get-key-string "$NAME" --format='value(keyString)')
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Deploy the worker Cloud Run Job
        run: |
          set -a; . apps/web/.env.production; set +a
          WORKER_KEY='${{ steps.worker_key.outputs.key }}'
          gcloud run jobs deploy dodo-worker \
            --image "europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dodo/worker:${GITHUB_SHA}" \
            --region europe-west1 \
            --service-account "dodo-worker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --max-retries 0 --task-timeout 3600 --cpu 1 --memory 1Gi --tasks 1 \
            --set-env-vars "FIREBASE_API_KEY=$WORKER_KEY,FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID,FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID,FUNCTIONS_REGION=europe-west1" \
            --quiet

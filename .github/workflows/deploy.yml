name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Keyless auth through Workload Identity Federation (see infra/bootstrap.sh).
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Write function parameters
        run: printf 'OWNER_EMAIL=%s\n' "${{ vars.OWNER_EMAIL }}" > apps/functions/lib/.env
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: Deploy to Firebase
        run: >
          pnpm exec firebase deploy --project ${{ vars.GCP_PROJECT_ID }} --non-interactive --force
          --only hosting,firestore:rules,firestore:indexes,storage,functions

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sandbox tools for the Mac daemon e2e (bubblewrap on Linux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Unit, emulator and security rules tests
        run: pnpm test:emulator
      - name: End-to-end on the emulators (fake model)
        run: pnpm test:e2e

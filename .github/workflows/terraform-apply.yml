# Applies infra/terraform from main. The workflow name matters: only a run of this workflow
# on main may act as dodo-terraform (see infra/bootstrap.sh).
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - apps/web/.env.production
      - .github/workflows/terraform-*.yml
  workflow_dispatch:

concurrency: terraform-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    if: vars.GCP_WIF_PROVIDER != ''
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: dodo-terraform@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
      - run: ./lookup.sh "${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
